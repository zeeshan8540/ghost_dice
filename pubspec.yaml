name: ghost_dice
description: Ghost Dice — Physical-Dice Digital Ludo. Players roll a real die and enter the number; the app handles rules, board, captures, and voting-based undo.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.4

  # Local persistence
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # Simple key/value preferences
  shared_preferences: ^2.2.3

  # Serialization
  json_annotation: ^4.9.0

  # IDs
  uuid: ^4.4.0

  # Platform detection
  universal_platform: ^1.1.0

  # Cupertino icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/sounds/
